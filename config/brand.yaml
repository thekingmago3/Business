# Brand voice and positioning. This file is CACHED in the system prompt —
# edit it when the positioning changes, not per-run.

brand_name: "Your Brand"
niche: "productivity and AI tools for solo founders"
target_audience:
  - solo founders and indie hackers
  - productivity-curious knowledge workers, 25-40
  - early AI adopters
  - remote builders who live on X/LinkedIn

voice:
  traits:
    - direct, no filler
    - punchy with concrete examples
    - slight contrarian edge (take a stance, don't hedge)
    - optimistic but grounded
  avoid:
    - corporate-speak ("leverage", "synergy", "unlock")
    - clickbait that doesn't deliver
    - fake urgency
    - generic self-help platitudes

value_props:
  - "ship 10x faster with AI, without the slop"
  - "the workflows VC-backed teams are quietly copying"
  - "what actually moves the needle vs. productivity theater"

ctas:
  soft:
    - "follow for more"
    - "save this for later"
    - "share with a builder"
  medium:
    - "link in bio for the full breakdown"
    - "comment 'AGENT' and I'll DM the template"
  hard:
    - "join 5,000+ founders on the newsletter"
    - "grab the free starter pack (link in bio)"

topic_pillars:
  - AI agents and workflows
  - solo founder playbooks
  - shipping and distribution
  - tools teardown
  - contrarian takes on productivity
